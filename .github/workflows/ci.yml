name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render (${{ matrix.ci_provider }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        ci_provider: [github, gitlab]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Render template for mise cache
        run: |
          uv run copier copy . "$GITHUB_WORKSPACE/mise-render" \
            --defaults \
            --trust \
            --skip-tasks \
            --exclude '*' \
            --exclude '!.mise.toml' \
            --data module_name=terraform-aws-example \
            --data module_description="Example module" \
            --data author_name="Test Author" \
            --data ci_provider=${{ matrix.ci_provider }} \
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
        with:
          working_directory: ${{ github.workspace }}/mise-render
          cache: true
      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('template/*package.json*.jinja', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Render template with tasks
        run: |
          uv run copier copy . /tmp/rendered \
            --defaults \
            --trust \
            --data module_name=terraform-aws-example \
            --data module_description="Example module" \
            --data author_name="Test Author" \
            --data ci_provider=${{ matrix.ci_provider }} \
      - name: Upload rendered artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rendered-${{ matrix.ci_provider }}
          path: /tmp/rendered
          include-hidden-files: true
          retention-days: 1

  test-pipeline:
    name: Test Pipeline (${{ matrix.ci_provider }})
    runs-on: ubuntu-26.04
    needs: render
    strategy:
      matrix:
        ci_provider: [github, gitlab]
    steps:
      - name: Download rendered artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rendered-${{ matrix.ci_provider }}
          path: /tmp/rendered

      - name: Install act
        if: matrix.ci_provider == 'github'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://github.com/nektos/act/releases/download/v0.2.74/act_Linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin act

      - name: Test generated lint.yml with act
        if: matrix.ci_provider == 'github'
        working-directory: /tmp/rendered
        run: |
          git remote add origin https://github.com/myorg/terraform-aws-example.git
          act push \
            -W .github/workflows/lint.yml \
            -j lint \
            -P ubuntu-latest=catthehacker/ubuntu:act-latest \
            --no-cache-server \
            --artifact-server-path /tmp/act-artifacts

      - name: Cache npm dependencies
        if: matrix.ci_provider == 'gitlab'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-gitlab-ci-local-v1

      - name: Install gitlab-ci-local
        if: matrix.ci_provider == 'gitlab'
        run: npm install -g gitlab-ci-local

      - name: Preview with gitlab-ci-local
        if: matrix.ci_provider == 'gitlab'
        working-directory: /tmp/rendered
        run: gitlab-ci-local --preview

      - name: Test generated .gitlab-ci.yml with gitlab-ci-local
        if: matrix.ci_provider == 'gitlab'
        working-directory: /tmp/rendered
        run: gitlab-ci-local parse-mise-versions tf-fmt tflint trivy tf-validate tf-docs --pull-policy if-not-present --timestamps
